[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aisc"
version = "0.0.0"
description = "AI Sims Creator Python sidecar — generation pipelines, DBPF packaging, AI orchestration."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AI Sims Creator" }]
dependencies = [
  "pydantic>=2.7",
  "structlog>=24.1",
  "keyring>=25.0",
  "anthropic>=0.34",
  "replicate>=0.28",
  "yoyo-migrations>=8.2",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-mock>=3.14",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML",
]

[project.scripts]
aisc-sidecar = "aisc.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["aisc*"]
exclude = ["tests*", "migrations*", "scripts*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "build", "dist"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "UP",   # pyupgrade
  "SIM",  # flake8-simplify
  "C4",   # flake8-comprehensions
  "RUF",  # ruff-specific
]
ignore = [
  "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# Mypy — strict type checking
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_any_generics = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_reexport = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["replicate.*", "yoyo.*", "pytest", "pytest.*"]
ignore_missing_imports = true

# Tests use pytest fixtures and decorators whose types aren't always available
# in the pre-commit mypy venv. Relax the strictest checks inside tests/ so that
# unit + integration suites don't require every fixture to be fully typed.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: integration test (real storage, mocked external clients)",
  "platform_parity: test that must produce identical output on macOS and Windows",
]
filterwarnings = [
  "error",
  "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source = ["aisc"]
branch = true

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]
