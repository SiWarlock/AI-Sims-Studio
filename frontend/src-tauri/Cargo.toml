[package]
name = "ai-sims-creator"
version = "0.0.0"
description = "AI Sims Creator desktop shell"
authors = ["AI Sims Creator"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ai_sims_creator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0-rc", features = [] }

[dependencies]
tauri = { version = "2.0.0-rc", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]
