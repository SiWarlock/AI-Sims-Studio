[project]
name = "aisims-pipeline"
version = "0.0.0"
description = "AI Sims Creator pipeline sidecar (FastAPI + LangGraph) — Phase-0 skeleton."
requires-python = ">=3.13,<3.14"
dependencies = [
    # Frozen cross-process contracts (§2.5) — the store persists these domain entities.
    "aisims-contracts",
    # §13 store: SQLAlchemy 2.0 async ORM + Alembic migrations.
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    # Async DB drivers: asyncpg = the Postgres prod target; aiosqlite backs the
    # deterministic unit-test layer (JSONB degrades to JSON via with_variant, store/db.py).
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pydantic>=2",
    "langgraph>=1.2.5",
    "langgraph-checkpoint-postgres>=3.1.0",
    "langgraph-checkpoint-sqlite>=3.1.0",
    # §7 real provider adapters: a thin raw-HTTP client (Claude Messages + OpenRouter
    # chat-completions). Raw httpx over the official SDKs keeps the model-agnostic seam thin
    # and the cassette wire-shape under our control (no SDK-version coupling). [3.3]
    "httpx>=0.27",
    # §7 concept-image silhouette-quality gate: RGBA decode + alpha-channel coverage /
    # connected-component / centeredness scoring. Pillow + numpy (lighter than opencv). [3.2]
    "pillow>=10",
    "numpy>=2",
    "keyring>=25.7.0",
]
# The Postgres *server* + pgvector are bundled at deploy/packaging time (§19, Phase 10);
# asyncpg/SQLAlchemy here are the client. The sidecar is the SOLE writer of Postgres +
# the canonical artifact tree (rule 3).

[tool.uv]
package = false

[tool.uv.sources]
aisims-contracts = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.mypy]
python_version = "3.13"
strict = true
explicit_package_bases = true
files = ["graph", "engine", "adapters", "registries", "store", "obs", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
